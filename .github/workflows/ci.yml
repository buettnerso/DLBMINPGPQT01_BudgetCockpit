name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  format-check:
    name: Format check (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          git config --global core.autocrlf false
          files=$(git ls-files '*.cpp' '*.h' | paste -sd " ")
          need=0
          for f in $files; do
            if clang-format -style=file "$f" -output-replacements-xml | grep -q "<replacement "; then
              echo "Formatting needed: $f"
              need=1
            fi
          done
          if [ $need -eq 1 ]; then
            echo "clang-format violations detected. Run clang-format -i on changed files.";
            exit 1
          fi

  build-windows:
    name: Build (Windows, MSBuild)
    runs-on: windows-latest
    needs: format-check
    steps:
      - uses: actions/checkout@v4
      - name: Setup Qt (falls benötigt)
        uses: qt-actions/setup-qt@v2
        with:
          qt-version: '6.6.2'
      - name: Build project
        shell: powershell
        run: |
          msbuild BudgetCockpit.vcxproj /p:Configuration=Release

  docs:
    name: Generate docs (Doxygen)
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Build documentation
        run: doxygen docs/Doxyfile
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-docs
          path: docs/api
